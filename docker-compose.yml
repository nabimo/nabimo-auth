services:
  postgres:
    image: postgres:17-alpine
    container_name: nabimo-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nabimo
      POSTGRES_PASSWORD: nabimo_dev
      POSTGRES_DB: nabimo_auth
    ports:
      - "5432:5432"
    volumes:
      - nabimo_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabimo -d nabimo_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nabimo_auth_postgres_data:
