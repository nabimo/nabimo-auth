name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nabimo
          POSTGRES_PASSWORD: nabimo_dev
          POSTGRES_DB: nabimo_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nabimo -d nabimo_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nabimo:nabimo_dev@localhost:5432/nabimo_auth?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @nabimo-auth/database exec prisma validate --config ../../prisma.config.ts

      - name: Generate Prisma Client
        run: pnpm --filter @nabimo-auth/database exec prisma generate --config ../../prisma.config.ts

      - name: Deploy database migrations
        run: pnpm --filter @nabimo-auth/database exec prisma migrate deploy --config ../../prisma.config.ts

      # Build workspace package declarations before consumers typecheck so
      # package boundaries resolve to published surfaces rather than source.
      - name: Build protocol
        run: pnpm --filter @nabimo-auth/protocol build

      - name: Build core
        run: pnpm --filter @nabimo-auth/core build

      - name: Build database
        run: pnpm --filter @nabimo-auth/database build

      - name: Build server
        run: pnpm --filter @nabimo-auth/server build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
