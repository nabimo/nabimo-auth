name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    env:
      DATABASE_URL: postgresql://nabimo:nabimo_dev@localhost:5432/nabimo_auth?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @nabimo-auth/database exec prisma validate --config ../../prisma.config.ts

      - name: Generate Prisma Client
        run: pnpm --filter @nabimo-auth/database exec prisma generate --config ../../prisma.config.ts

      # CI pipeline: typecheck, tests, and build run after the generated client.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
