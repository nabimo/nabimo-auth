openapi: 3.0.3
info:
  title: Nabimo Auth API
  version: 0.1.0
  description: Framework-agnostic HTTP authentication API exposed by the Nabimo Auth server.
servers:
  - url: http://localhost:3000
paths:
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordCredentials' }
      responses:
        '200': { description: User registered and authenticated. In cookie mode the refresh token is set as an HttpOnly cookie and omitted from JSON., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AuthenticationResponse' }, { $ref: '#/components/schemas/CookieRefreshResponse' }] } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/AccountAlreadyExists' }
  /auth/login/password:
    post:
      operationId: loginWithPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordCredentials' }
      responses:
        '200': { description: User authenticated or a two-factor challenge issued. In cookie mode the refresh token is set as an HttpOnly cookie and omitted from JSON., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AuthenticationResponse' }, { $ref: '#/components/schemas/CookieRefreshResponse' }, { $ref: '#/components/schemas/TwoFactorRequiredResponse' }] } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /auth/2fa/login:
    post:
      operationId: loginWithTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorLoginRequest' }
      responses:
        '200': { description: User authenticated after two-factor verification. In cookie mode the refresh token is set as an HttpOnly cookie and omitted from JSON., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AuthenticationResponse' }, { $ref: '#/components/schemas/CookieRefreshResponse' }] } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: Two-factor code or recovery code is invalid or the challenge has expired., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/refresh:
    post:
      operationId: refresh
      description: Refresh using either the JSON refreshToken body (bearer mode) or the configured HttpOnly refresh cookie (cookie mode). Cookie mode takes precedence when the configured cookie is present.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { description: Tokens rotated. In cookie mode the replacement refresh token is set as an HttpOnly cookie and omitted from JSON., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/AuthenticationResponse' }, { $ref: '#/components/schemas/CookieRefreshResponse' }] } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current session revoked. Cookie mode also clears the refresh cookie., content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /auth/logout-all:
    post:
      operationId: logoutAll
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All active sessions revoked. Cookie mode also clears the refresh cookie., content: { application/json: { schema: { $ref: '#/components/schemas/LogoutAllResponse' } } } }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /auth/verify/email/request:
    post:
      operationId: requestEmailVerification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
      responses:
        '200': { description: Email verification OTP dispatched., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationChallengeResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { description: OTP request rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/verify/phone/request:
    post:
      operationId: requestPhoneVerification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneVerificationRequest' }
      responses:
        '200': { description: Phone verification OTP dispatched., content: { application/json: { schema: { $ref: '#/components/schemas/VerificationChallengeResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { description: OTP request rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/verify/otp:
    post:
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200': { description: OTP verified., content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: OTP invalid or expired., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/password/reset/request:
    post:
      operationId: requestPasswordReset
      description: Always returns the same success response for known and unknown email addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '200': { description: Reset request accepted., content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '429': { description: Reset request rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '200': { description: Password changed and all existing sessions revoked., content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: Reset token invalid or expired., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/2fa/setup:
    post:
      operationId: setupTwoFactor
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: TOTP secret and one-time recovery codes generated., content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorSetupResponse' } } } }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/2fa/enable:
    post:
      operationId: enableTwoFactor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCodeRequest' }
      responses:
        '200': { description: Two-factor authentication enabled., content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCodeRequest' }
      responses:
        '200': { description: Two-factor authentication disabled., content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '501': { $ref: '#/components/responses/NotConfigured' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PasswordCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties: { refreshToken: { type: string, minLength: 1 } }
    EmailVerificationRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    PhoneVerificationRequest:
      type: object
      required: [phone]
      properties: { phone: { type: string, pattern: '^\\+?[1-9]\\d{6,14}$' } }
    VerifyOtpRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, minLength: 1 }
        code: { type: string, pattern: '^\\d{6}$' }
    TwoFactorLoginRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string, minLength: 32 }
        code: { type: string, minLength: 1 }
        description: { type: string, description: A 6-digit TOTP code or a single-use recovery code. }
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\\d{6}$' }
    TwoFactorSetupResponse:
      type: object
      required: [secret, otpauthUri, recoveryCodes]
      properties:
        secret: { type: string }
        otpauthUri: { type: string, format: uri }
        recoveryCodes:
          type: array
          minItems: 1
          items: { type: string }
    TwoFactorRequiredResponse:
      type: object
      required: [twoFactorRequired, user, challengeToken, challengeExpiresAt]
      properties:
        twoFactorRequired: { type: boolean, enum: [true] }
        user: { $ref: '#/components/schemas/User' }
        challengeToken: { type: string, minLength: 32 }
        challengeExpiresAt: { type: string, format: date-time }
    VerificationChallengeResponse:
      type: object
      required: [challengeId, type, target, expiresAt]
      properties:
        challengeId: { type: string, minLength: 1 }
        type: { type: string, enum: [email_otp, phone_otp] }
        target: { type: string }
        expiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id]
      properties:
        id: { type: string }
        email: { type: string, format: email, nullable: true }
    AuthenticationResponse:
      type: object
      required: [user, sessionId, accessToken, refreshToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        sessionId: { type: string }
        accessToken: { type: string }
        refreshToken: { type: string }
    CookieRefreshResponse:
      type: object
      required: [user, sessionId, accessToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        sessionId: { type: string }
        accessToken: { type: string }
    SuccessResponse:
      type: object
      required: [success]
      properties: { success: { type: boolean, enum: [true] } }
    LogoutAllResponse:
      allOf:
        - { $ref: '#/components/schemas/SuccessResponse' }
        - type: object
          required: [revokedSessions]
          properties: { revokedSessions: { type: integer, minimum: 0 } }
    ErrorResponse:
      type: object
      description: H3 error response. The stable Nabimo error code is exposed in data.code.
      properties:
        statusCode: { type: integer }
        statusMessage: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_CREDENTIALS, ACCOUNT_ALREADY_EXISTS, INVALID_OTP, OTP_COOLDOWN, OTP_RATE_LIMITED, RATE_LIMITED, INVALID_PASSWORD_RESET_TOKEN, TWO_FACTOR_REQUIRED, INVALID_2FA_CODE, NOT_CONFIGURED]
  responses:
    InvalidRequest:
      description: Request body is malformed or required fields are missing.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InvalidCredentials:
      description: Authentication credentials are invalid or the session is no longer active.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    AccountAlreadyExists:
      description: An account already exists for the supplied email.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotConfigured:
      description: The requested authentication feature is not configured.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
